name: Test, build, push, and deploy
# A trigger for the pipeline to run after a push to main
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  DEPLOY_ROOT: dev-ops/DeployReady

jobs:
  test-build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      # Fetch the repository on the runner
      - name: Check out the repository
        uses: actions/checkout@v4

      # Match the app’s Node version and cache npm dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.DEPLOY_ROOT }}/app/package-lock.json

      # Install dependencies (including test-only) from package-lock.json
      - name: Install app dependencies
        run: npm ci
        working-directory: ${{ env.DEPLOY_ROOT }}/app

      # Block the pipeline if tests fail
      - name: Run tests
        run: npm test
        working-directory: ${{ env.DEPLOY_ROOT }}/app

      # Tag the image with this commit for traceable deploys
      - name: Set container image name and tag
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${REPO_LC}/kora-api:${{ github.sha }}" >> $GITHUB_ENV

      # Registry login on the runner so we can push the image
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One-step build+push avoids GHCR "unknown blob" (BuildKit attestation refs without those blobs on push)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the same Dockerfile used locally; push the same image the server will pull
      - name: Build and push Docker image
        run: docker buildx build --provenance=false --sbom=false --push -t "$IMAGE" -f Dockerfile .
        working-directory: ${{ env.DEPLOY_ROOT }}
        env:
          IMAGE: ${{ env.IMAGE }}

      # Pull on EC2 and replace the running container
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GHCR_PAT,GHCR_USER
          script: |
            set -e
            if [ -n "$GHCR_PAT" ] && [ -n "$GHCR_USER" ]; then
              echo "$GHCR_PAT" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            sudo docker pull "$IMAGE"
            sudo docker stop kora 2>/dev/null || true
            sudo docker rm kora 2>/dev/null || true
            sudo docker run -d --name kora --restart unless-stopped -p 80:3000 -e PORT=3000 "$IMAGE"
        env:
          IMAGE: ${{ env.IMAGE }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
